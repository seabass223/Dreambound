<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none; }
  body.free { cursor: default; }   /* the game doesn't have the mouse: show the OS cursor */
  canvas { display: block; width: 100vw; height: 100vh; }
  #veil { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; transition: opacity 1.5s ease; }
  #veil > * { grid-area: 1 / 1; }
  /* The loading track, stage and countdown are added by src/ui/loadingVeil.js. */
  /* Ready: the track goes, and the breathing light (click to begin) comes. */
  #veil i { width: 7px; height: 7px; border-radius: 50%; background: #d8cbb0; box-shadow: 0 0 18px 6px rgba(216, 203, 176, 0.35); opacity: 0; visibility: hidden; }
  #veil.ready i { visibility: visible; animation: breathe 4.5s ease-in-out 0.6s infinite backwards; }
  @keyframes breathe { 0%, 100% { opacity: 0.08; transform: scale(0.8); } 50% { opacity: 0.55; transform: scale(1.15); } }
</style>
</head>
<body>
<div id="veil"><i></i></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
